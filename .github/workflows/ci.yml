name: CI

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup SourcePawn compiler
        uses: rumblefrog/setup-sp@master
        with:
          version: "1.12.x"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: |
          git clone --depth=1 -b "1.12-dev" https://github.com/alliedmodders/sourcemod.git sm_core
          cp -R sm_core/addons/sourcemod/* addons/sourcemod/
          git clone --depth=1 https://github.com/srcdslab/sm-plugin-MultiColors.git
          cp -R sm-plugin-MultiColors/addons/sourcemod/* addons/sourcemod/
          git clone --depth=1 https://github.com/srcdslab/sm-plugin-AFKManager.git
          cp -R sm-plugin-AFKManager/addons/sourcemod/* addons/sourcemod/
          git clone --depth=1 https://github.com/srcdslab/sm-plugin-TeamManager.git
          cp -R sm-plugin-TeamManager/addons/sourcemod/* addons/sourcemod/

      - name: Build sourcemod plugin
        working-directory: addons/sourcemod/scripting
        run: |
          spcomp -i include -o ../plugins/zombiereloaded.smx zombiereloaded.sp

      - name: Create package
        run: |
          mkdir -p /tmp/package
          cp -R addons /tmp/package
          if [ -d "common" ]; then
            cp -R common /tmp/package/
          fi

      - name: Upload build archive for test runners
        uses: actions/upload-artifact@v7
        with:
          name: ${{ runner.os }}
          path: /tmp/package

  tag:
    name: Tag
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7

      - uses: dev-drprasad/delete-tag-and-release@v1.1
        with:
          delete_release: true
          tag_name: latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: rickstaa/action-create-tag@v1
        with:
          tag: latest
          github_token: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    needs: [build, tag]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: ${{ runner.os }}
          path: artifacts

      - name: Versioning
        run: |
          version="latest"
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
          fi
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Package
        run: |
          cd artifacts
          tar -czf ../${{ github.event.repository.name }}-${{ env.RELEASE_VERSION }}.tar.gz .
          cd ..

      - name: Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: "*.tar.gz"
          tag: ${{ env.RELEASE_VERSION }}
          file_glob: true
          overwrite: true
