name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: write
jobs:
  translations:
    name: Translations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: srcdslab/smtranslate@v1
        with:
          path: common/addons/sourcemod/translations
          # Set the TRANSLATIONS_FAIL_ON repository variable to "warning" to make warnings blocking
          fail-on: ${{ vars.TRANSLATIONS_FAIL_ON || 'error' }}

  build:
    name: Build (SM ${{ matrix.sm-label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - sm-version: "1.12.x"
            sm-label: "1.12"
          # Pinned to 1.13.0.7427, the build our servers run (2026-11-11),
          # not the latest 1.13 snapshot. setup-sp names it "1.13.7427".
          - sm-version: "1.13.7427"
            sm-label: "1.13"
    steps:
      - uses: actions/checkout@v7
      - name: Setup SourcePawn compiler
        uses: rumblefrog/setup-sp@v1.3.1
        with:
          version: ${{ matrix.sm-version }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install dependencies
        run: |
          set -euo pipefail
          mkdir -p addons/sourcemod/scripting/include
          git clone --depth=1 https://github.com/srcdslab/sm-plugin-MultiColors.git deps/multicolors
          cp -R deps/multicolors/addons/sourcemod/scripting/include/* addons/sourcemod/scripting/include/
          git clone --depth=1 https://github.com/srcdslab/sm-plugin-AFKManager.git deps/afkmanager
          cp -R deps/afkmanager/addons/sourcemod/scripting/include/* addons/sourcemod/scripting/include/
          git clone --depth=1 https://github.com/srcdslab/sm-plugin-TeamManager.git deps/teammanager
          cp -R deps/teammanager/addons/sourcemod/scripting/include/* addons/sourcemod/scripting/include/
      - name: Build sourcemod plugin
        working-directory: src/addons/sourcemod/scripting
        run: |
          set -euo pipefail
          mkdir -p ../plugins
          spcomp -i include -i "$GITHUB_WORKSPACE/addons/sourcemod/scripting/include" -o ../plugins/zombiereloaded.smx zombiereloaded.sp
      - name: Create package
        run: |
          set -euo pipefail
          mkdir -p /tmp/package/addons/sourcemod/plugins
          cp src/addons/sourcemod/plugins/*.smx /tmp/package/addons/sourcemod/plugins/
          if [ -d "common" ]; then
            cp -R common/* /tmp/package/
          fi
      - name: Upload build archive for test runners
        uses: actions/upload-artifact@v7
        with:
          name: package-sm${{ matrix.sm-label }}
          path: /tmp/package
  tag:
    name: Tag
    needs: build
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Delete existing "latest" release and tag
        run: |
          set -euo pipefail
          gh release delete latest --cleanup-tag --yes || true
          # The tag may exist without a release, so delete it explicitly
          git push origin :refs/tags/latest || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: rickstaa/action-create-tag@v1
        with:
          tag: latest
          force_push_tag: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    needs: [build, tag]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: package-sm*
          path: artifacts
      - name: Versioning
        run: |
          set -euo pipefail
          version="latest"
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
          fi
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
      # One archive per SourceMod version:
      # <repo>-<version>-sm1.12.tar.gz and <repo>-<version>-sm1.13.tar.gz
      - name: Package
        run: |
          set -euo pipefail
          for dir in artifacts/package-sm*/; do
            label="$(basename "$dir")"
            label="${label#package-}"
            tar -czf "${{ github.event.repository.name }}-${{ env.RELEASE_VERSION }}-${label}.tar.gz" -C "$dir" .
          done
          ls -l *.tar.gz
      - name: Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: "*.tar.gz"
          tag: ${{ env.RELEASE_VERSION }}
          file_glob: true
          overwrite: true
